name: DAPS — Optimization

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'  # Domingo 4am UTC

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run optimization
        run: python main.py --phase optimize
      - uses: actions/upload-artifact@v4
        with:
          name: optimization-results
          path: reports/output/
          retention-days: 30
