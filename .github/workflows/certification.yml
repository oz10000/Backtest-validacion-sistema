name: DAPS — Certification

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run full certification
        run: python main.py --phase all
      - name: Generate certification badge
        run: |
          echo "Certification completed at $(date)" > reports/output/certification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: certification-report
          path: reports/output/
          retention-days: 90
