name: DAPS — Monte Carlo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 2'  # Martes 5am UTC

jobs:
  monte_carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run validation
        run: python main.py --phase validate
      - uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-results
          path: reports/output/
          retention-days: 30
